# Spring Cloud Config — opcional. ".env" (ignorado por git) aporta los secretos en local.
spring.config.import=optional:configserver:,optional:file:./.env[.properties]
spring.application.name=servicio-onboarding-bancario
server.port=${PORT:8000}
server.servlet.context-path=/api/v1

# =============================================
# GestoPago - Autenticación
# =============================================
gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.id-distribuidor=83
gestopago.auth.codigo-dispositivo=GPS83-TPV-17
# SECRETO: se lee del entorno, sin valor por defecto (la app no arranca si falta).
gestopago.auth.password=${GESTOPAGO_AUTH_PASSWORD}
gestopago.auth.refresh-rate-ms=3600000

# =============================================
# GestoPago - Servicio de Productos
# =============================================
gestopago.productos.url=https://gestopago.portalventas.net
# NOTA: Este token estático es un fallback de emergencia.
# El token activo se gestiona dinámicamente desde la BD via GestoPagoTokenService.
# En producción, utilizar Spring Cloud Config o variable de entorno.
gestopago.productos.token=${GESTOPAGO_TOKEN:}
# =============================================
# GestoPago - Configuración Feign (timeouts)
# =============================================
gestopago.feign.connect-timeout-ms=5000
gestopago.feign.read-timeout-ms=15000
# =============================================
# PostgreSQL — Base de datos principal
# =============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gestopago_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
# SECRETO: sin valor por defecto.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Seguridad JWT
# SECRETO: sin valor por defecto (mínimo 32 caracteres).
banco.security.jwt.secret=${BANCO_JWT_SECRET}
banco.security.jwt.expiration-ms=86400000

# Parámetros de Negocio Bancario
banco.onboarding.cuenta.saldo-inicial-default=1000.00
banco.onboarding.cuenta.prefijo-cuenta=012

# =============================================
# MongoDB — Cat Product
# =============================================
spring.data.mongodb.uri=mongodb://localhost:27017/gestopago_db
spring.data.mongodb.database=gestopago_db

# Catálogo GestoPago: UNA vez al día (6:00). El proveedor bloquea la IP si se consulta
# getProductList más de 3 veces al día; nunca bajar esta frecuencia.
gestopago.productos.cron=0 0 6 * * *

# =============================================
# Jackson — Serialización de fechas
# =============================================
# Serializa LocalDateTime/LocalDate como strings ISO-8601 en lugar de arrays numéricos
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# =============================================
# GestoPago - Transacciones (SendTx)
# =============================================
gestopago.tx.url=https://gestopago.portalventas.net
# SECRETOS: llave/IV AES y API key se leen del entorno, sin valor por defecto.
gestopago.tx.secret-key=${GESTOPAGO_TX_SECRET_KEY}
gestopago.tx.iv=${GESTOPAGO_TX_IV}
gestopago.tx.x-api-key=${GESTOPAGO_TX_API_KEY}
gestopago.tx.unidad=083





