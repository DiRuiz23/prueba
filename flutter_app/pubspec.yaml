name: apphasani_mobile
description: Plataforma móvil de comercio digital AppHasani integrada con GestoPago (Clean Architecture + BLoC).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  equatable: ^2.0.5
  uuid: ^4.5.1
  intl: ^0.19.0
  go_router: ^14.6.2
  get_it: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

